plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    compileSdk 35
    namespace 'com.svarnew.app'
    ndkVersion "26.1.10909125"


    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.svarnew.app"
        minSdkVersion 26
        targetSdkVersion 35 //flutter.targetSdkVersion
        multiDexEnabled true
        versionCode 802
        versionName "0.0.1"
        
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // kotlinOptions {
    //     jvmTarget = "11"
    // }
     compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    signingConfigs {
        debug {}
    release {
        // storeFile file('C:\\Users\\SOI\\upload-keystore.jks')
        // storePassword '30052003'
        // keyAlias 'upload'
        // keyPassword '30052003'
    }
}
    

    buildTypes {
        
        release {
        shrinkResources true
        signingConfig signingConfigs.debug
        // signingConfig signingConfigs.release
        minifyEnabled true
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    }
    // release{
    //     signingConfig = signingConfigs.debug
    // }

    }
    //  splits {
    //     abi {
    //         enable true
    //         reset()
    //         include 'armeabi-v7a', 'arm64-v8a'
    //         universalApk false  // If you want to also generate a universal APK that includes all architectures, set this to true.
    //     }
    // }
}

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = '17'
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}
flutter {
    source '../..'
}

dependencies {
    // Firebase BoM
    implementation platform("com.google.firebase:firebase-bom:33.1.0")
    
    implementation("com.google.firebase:firebase-appdistribution:16.0.0-beta13") 

    implementation "androidx.multidex:multidex:2.0.1"
}

